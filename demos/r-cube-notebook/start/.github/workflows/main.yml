# Run this by hand (Actions tab > .github/workflows/main.yml > Run workflow).
# It plays a collaborator who pushes a different fix to the same code cell of cube.ipynb,
# along with that cell's new output, so that your own fix conflicts with it.
on:
  workflow_dispatch:

jobs:
  createConflict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Commit a different fix to cube.ipynb and push it
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          sed -i -e 's/x\^2/x * x * x/' -e 's/"4"$/"8"/' -e 's/"\[1\] 4"$/"[1] 8"/' cube.ipynb
          git commit -m "Here's a fix to the file!" -a
          git push
