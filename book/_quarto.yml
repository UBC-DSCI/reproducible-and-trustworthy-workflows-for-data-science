# ubc-html is the UBC brand (UBC-MDS/ubc-quarto-brand, in _extensions/):
# theme, listing labels, and the look of the callout types (activity,
# exercise, definition, relevance-project).
format:
  ubc-html:
    css: styles.css
  # pdf:
  #   documentclass: scrreprt

# The brand styles custom-callout's callouts but does not ship it: it is
# installed beside the brand (quarto add coatless-quarto/custom-callout).
filters:
  - custom-callout
