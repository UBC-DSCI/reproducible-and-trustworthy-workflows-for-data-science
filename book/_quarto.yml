project:
  type: book
  output-dir: ../docs

number-depth: 3

book:
  title: "Reproducible and Trustworthy Workflows for Data Science"
  author: "Tiffany A. Timbers, Joel Ostblom, Florencia D’Andrea, Rodolfo Lourenzutti, Daniel Chen"
  #date: "2024-10-28"
  search: true
  repo-url: https://github.com/UBC-DSCI/reproducible-and-trustworthy-workflows-for-data-science/
  #repo-actions: [edit]
  chapters:
    - index.qmd
    - part: parts/intro.qmd
      chapters:
      - lectures/0110-data-science-workflows.qmd
      - lectures/0120-bash-shell.qmd
    - part: parts/version-control.qmd
      chapters:
      - lectures/0210-ssh-authentication.qmd
      - lectures/0220-git-basics.qmd
      - lectures/0230-git-merge-conflicts.qmd
      - lectures/0240-git-ignore.qmd
      - lectures/0250-git-history.qmd
      - lectures/0260-git-branches.qmd
    - part: parts/collaborating-on-github.qmd
      chapters:
      - lectures/0310-github-pull-requests.qmd
      - lectures/0320-github-code-review.qmd
      - lectures/0330-branching-workflows.qmd
      - lectures/0340-github-project-management.qmd
      - lectures/0350-github-branch-protection.qmd
    - part: parts/project-organization.qmd
      chapters:
      - lectures/0410-filenames-project-organization.qmd
    - part: parts/virtual-environments.qmd
      chapters:
      - lectures/0510-virtual-environments.qmd
      - lectures/0520-virtual-environments-r-renv.qmd
      - lectures/0530-virtual-environments-python-uv.qmd
      - lectures/0540-virtual-environments-python-conda.qmd
      - lectures/0550-virtual-environments-python-conda-lock.qmd
    - part: parts/containers.qmd
      chapters:
      - lectures/0610-containers.qmd
      - lectures/0620-containers-running.qmd
      - lectures/0630-containers-docker-compose.qmd
      - lectures/0640-containers-building.qmd
    - part: parts/data-validation.qmd
      chapters:
      - lectures/0710-data-validation.qmd
      - lectures/0720-data-validation-r-pointblank.qmd
      - lectures/0730-data-validation-python-pandera.qmd
      - lectures/0740-data-validation-python-deepchecks.qmd
      - lectures/0750-data-validation-python-pointblank.qmd
    - part: parts/scripts-and-reports.qmd
      chapters:
      - lectures/0810-scripts.qmd
      - lectures/0820-reproducible-reports-quarto.qmd
    - part: parts/pipelines.qmd
      chapters:
      - lectures/0910-pipelines-scripts.qmd
      - lectures/0920-pipelines-make.qmd
    - part: parts/software-testing-for-data-science.qmd
      chapters:
      - lectures/1010-testing.qmd
      - lectures/1020-testing-r-testthat.qmd
      - lectures/1030-testing-python-pytest.qmd
      - lectures/1040-testing-images.qmd
      - lectures/1050-testing-quality.qmd
    - part: parts/packaging.qmd
      chapters:
      - lectures/1110-packaging.qmd
      - lectures/1120-packaging-python.qmd
      - lectures/1130-packaging-python-uv.qmd
      - lectures/1140-packaging-python-poetry.qmd
      - lectures/1150-packaging-python-hatch.qmd
      - lectures/1160-packaging-r.qmd
      - lectures/1170-packaging-tool-philosophies.qmd
    - part: parts/testing-packages.qmd
      chapters:
      - lectures/1210-package-testing-python-pytest.qmd
      - lectures/1220-package-coverage-python.qmd
    - part: parts/ci.qmd
      chapters:
      - lectures/1310-continuous-integration.qmd
      - lectures/1320-github-actions.qmd
      - lectures/1330-github-actions-matrix.qmd
      - lectures/1340-github-actions-testing.qmd
      - lectures/1350-github-actions-case-study-python.qmd
      - lectures/1360-github-actions-case-study-r.qmd
    - part: parts/package-documentation.qmd
      chapters:
      - lectures/1410-package-documentation-python-sphinx.qmd
      - lectures/1420-package-documentation-python-quartodoc.qmd
      - lectures/1430-package-documentation-r.qmd
    - part: parts/cd.qmd
      chapters:
      - lectures/1510-continuous-deployment.qmd
      - lectures/1520-continuous-deployment-python-poetry.qmd
      - lectures/1530-continuous-deployment-python-hatch-quartodoc.qmd
      - lectures/1540-continuous-deployment-r.qmd
      - lectures/1550-package-peer-review.qmd
      - lectures/1560-package-versioning-python.qmd
    - part: parts/licenses-copyright.qmd
      chapters:
      - lectures/1610-copyright-licenses.qmd
    - part: parts/wrap-up.qmd
      chapters:
      - lectures/1710-reproducibility-wrap-up.qmd
    - part: parts/appendix.qmd
      chapters:
        - lectures/9010-functions-python.qmd
        - lectures/9020-functions-r.qmd
        - lectures/9030-reproducible-reports-rmarkdown-jupyter.qmd
        - lectures/9040-quarto-github-pages.qmd
    - part: parts/archive.qmd

format:
  html:
    css: styles.css
    theme:
      - cosmo
  # pdf:
  #   documentclass: scrreprt

custom-callout:
  definition:
    icon: true
    icon-symbol: "📝"
    color: "pink"

  activity:
    icon: true
    icon-symbol: "🧩"
    color: "blue"

  exercise:
    icon: true
    icon-symbol: "🏋️"
    color: "green"

  relevance-project:
    title: Relevance to course project
    icon: true
    icon-symbol: "💻"
    color: "orange"

filters:
- custom-callout
