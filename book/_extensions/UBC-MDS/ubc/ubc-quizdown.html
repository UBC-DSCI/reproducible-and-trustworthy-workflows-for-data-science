<!--
  The extension's own addition to `quizdown-theme.html`, which stays as
  fetched from DSCI 521 (Q&A 22, 26).

  quizdown paints a matching question's answer chips a fixed light green
  (`#e8f5e9`) and lets them inherit the page's text colour: in dark mode,
  near-white text on near-white. `quizdown-theme.html` themes every other part
  of a matching question but not the chip itself, so this injects one more
  rule into each quiz's shadow root, the same way, written against
  `--mds-quiz-chip-*` from `ubc.scss`. Used and placed chips keep the looks
  quizdown and `quizdown-theme.html` give them.
-->
<script>
  (() => {
    const CSS = `
      .chip:not(.chip-used):not(.chip-placed) {
        background-color: var(--mds-quiz-chip-bg) !important;
        border-color: var(--mds-quiz-chip-border) !important;
        color: var(--mds-quiz-fg) !important;
      }
    `;

    // Returns the number of quizzes that do not have a shadow root yet.
    const paint = () => {
      let waiting = 0;
      for (const host of document.querySelectorAll(".quizdown")) {
        const root = host.shadowRoot;
        if (!root) {
          waiting += 1;
          continue;
        }
        if (root.querySelector("style[data-ubc-quiz-chips]")) continue;
        const style = document.createElement("style");
        style.setAttribute("data-ubc-quiz-chips", "");
        style.textContent = CSS;
        root.appendChild(style);
      }
      return waiting;
    };

    // As in `quizdown-theme.html`: quizdown makes the shadow roots after
    // `load`, so the first try waits a task, then retries for a few frames,
    // and gives up after five seconds.
    addEventListener("load", () => {
      const started = performance.now();
      const tick = () => {
        if (paint() > 0 && performance.now() - started < 5000) {
          requestAnimationFrame(tick);
        }
      };
      setTimeout(tick, 0);
    });
  })();
</script>
