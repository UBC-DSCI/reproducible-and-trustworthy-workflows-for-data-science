<!--
  Theme the quizdown quizzes.

  `_extensions/quizdown` renders every quiz into a shadow root
  (`attachShadow({mode: "open"})`), so nothing in `styles.scss` reaches inside
  one -- a quiz arrives on the page wearing quizdown's own defaults, which are
  `steelblue` on `#f2f2f2` with black text. In dark mode that is not merely
  off-brand, it is unreadable: the parts that take a *background* from
  quizdown's palette but *inherit* their text colour -- the left column of a
  matching question, an evaluated slot, the per-pair feedback -- end up
  painting the page's near-white body text onto a near-white fill, 1.03:1.

  Two facts make that fixable from outside the shadow root:

    * custom properties inherit *through* the shadow boundary, so the
      `--mds-quiz-*` values set on `:root` in `styles.scss` are readable from
      inside a quiz;
    * quizdown writes its three colours as inline styles on
      `.quizdown-content`, and `!important` in a stylesheet beats an inline
      declaration.

  So this file injects one stylesheet into each quiz's shadow root, written
  entirely against `--mds-quiz-*`. The light and dark values of those live in
  `styles.scss` and `styles-dark.scss`, and Quarto swaps those two bundles on
  the colour-mode toggle -- so a quiz follows the toggle with no JavaScript of
  its own.

  Wired in from `format.html.include-after-body` in `_quarto.yml`, which is
  what keeps the vendored extension under `_extensions/quizdown/` untouched: a
  re-add or an update of that extension cannot clobber any of this.

  Two things are deliberately left alone:

    * `.hljs`, the highlight.js "github" theme quizdown bundles for a *fenced*
      code block inside a question. Its plate is light in both colour modes,
      but so are the token colours painted on it, so it stays self-consistent
      and readable; re-tinting the plate alone would break it, and re-tinting
      the tokens means shipping a second syntax theme. No question in the book
      uses a fenced block -- inline code is themed below, and inline code is
      what the questions actually use.
    * `.print-review`, the plain questions-and-answers block quizdown reveals
      under `@media print`. Paper is white in both colour modes, so the light
      colours there are already the right ones.
-->
<script>
  (() => {
    // Note for editing: this is a template literal, so nothing inside it may
    // be quoted in backticks the way the prose around it is -- a stray one
    // ends the string, and the page fails with a JavaScript syntax error
    // rather than with anything you would notice in the CSS.
    //
    // Every declaration below is `!important`, for two reasons that are not
    // about winning an argument with the extension. Svelte scopes its own
    // rules with a build hash (`.prompt.svelte-1ge161l`), which out-specifies
    // anything we can write without hard-coding a hash that changes on every
    // quizdown release; and the order our <style> ends up in relative to
    // Svelte's, inside a shadow root neither of us owns, is not ours to pick.
    const CSS = `
      /* ---- the three knobs quizdown itself exposes ------------------------
         Set as inline styles on .quizdown-content from the quiz config, so
         !important is the only thing that can move them. Remapping these three
         alone fixes most of dark mode: everything that reads its background
         from --quizdown-color-secondary and inherits its text colour then
         lands on a surface that belongs to the current mode. */
      .quizdown-content {
        --quizdown-color-primary: var(--mds-quiz-accent) !important;
        --quizdown-color-secondary: var(--mds-quiz-surface) !important;
        --quizdown-color-text: var(--mds-quiz-fg) !important;
      }

      /* ---- inline code in a question -------------------------------------
         quizdown paints this #333 on #f8f8f8 in both modes. The book has its
         own inline-code pair, one per mode, under typography.monospace-inline
         in _brand.yml. */
      code {
        color: var(--mds-quiz-code-fg) !important;
        background-color: var(--mds-quiz-code-bg) !important;
      }

      /* ---- buttons -------------------------------------------------------
         Hard-coded to a white fill, which is a glaring plate on the dark page.
         The hover is brightness(0.9): darkening is only a change you can see
         when the surface starts light, so its direction is per-mode too. */
      button {
        background-color: var(--mds-quiz-surface) !important;
        color: var(--mds-quiz-fg) !important;
      }
      button:disabled {
        background-color: var(--mds-quiz-surface) !important;
        color: var(--mds-quiz-muted) !important;
      }
      button:hover:not(:checked):not(:active):not(:disabled) {
        filter: var(--mds-quiz-press) !important;
      }

      /* ---- multiple choice and single choice ------------------------------
         The option rows are already painted from the two variables remapped
         above; only the hover is hard-coded. */
      [type='checkbox']:hover + span,
      [type='checkbox']:focus + span,
      [type='radio']:hover + span,
      [type='radio']:focus + span {
        filter: var(--mds-quiz-press) !important;
      }

      /* ---- sequence (drag to order) --------------------------------------
         The rows come from the variables; the reorder buttons take a black
         focus ring, which is invisible on the dark page. */
      .buttons button:focus {
        border-color: var(--mds-quiz-accent) !important;
      }

      /* ---- matching (drag a chip into a slot) -----------------------------
         The type with the most hard-coded colour in it, and the one where the
         dark-mode failure was actually visible: .prompt takes its fill from
         quizdown's palette and its text colour from the page, so it painted
         near-white body text onto near-white #f2f2f2. */
      .arrow,
      .placeholder {
        color: var(--mds-quiz-muted) !important;
      }
      .slot,
      .pool {
        border-color: var(--mds-quiz-border) !important;
      }
      .slot-selected,
      .slot-dragover,
      .pool-dragover {
        background-color: var(--mds-quiz-surface) !important;
      }
      .chip:hover {
        filter: var(--mds-quiz-press) !important;
      }
      .chip-used {
        background-color: var(--mds-quiz-surface) !important;
        border-color: var(--mds-quiz-muted) !important;
      }

      /* ---- the evaluated state -------------------------------------------
         Green and red, which the book already has: the success and danger
         roles in _brand.yml each carry a value per mode. */
      .slot.correct {
        border-color: var(--mds-quiz-correct) !important;
        background-color: var(--mds-quiz-correct-bg) !important;
      }
      .slot.wrong,
      .slot.empty-eval {
        border-color: var(--mds-quiz-wrong) !important;
        background-color: var(--mds-quiz-wrong-bg) !important;
      }
      .badge-correct,
      .correct-hint {
        color: var(--mds-quiz-correct) !important;
      }
      .badge-wrong {
        color: var(--mds-quiz-wrong) !important;
      }
      .pair-feedback {
        border-left-color: var(--mds-quiz-correct) !important;
        background-color: var(--mds-quiz-correct-bg) !important;
      }
      .pair-feedback-wrong {
        border-left-color: var(--mds-quiz-wrong) !important;
        background-color: var(--mds-quiz-wrong-bg) !important;
      }

      /* ---- the credit line under every quiz ------------------------------- */
      .credits,
      .credits a {
        color: var(--mds-quiz-muted) !important;
      }
    `;

    // Returns the number of quizzes that do not have a shadow root yet.
    const paint = () => {
      let waiting = 0;
      for (const host of document.querySelectorAll(".quizdown")) {
        const root = host.shadowRoot;
        if (!root) {
          waiting += 1;
          continue;
        }
        if (root.querySelector("style[data-mds-quiz-theme]")) continue;
        const style = document.createElement("style");
        style.setAttribute("data-mds-quiz-theme", "");
        style.textContent = CSS;
        root.appendChild(style);
      }
      return waiting;
    };

    // quizdown creates the shadow roots from a `load` listener that it only
    // registers once `DOMContentLoaded` has fired -- later than this script,
    // which is inline at the end of <body>. A `load` listener added here would
    // therefore run *before* the one that creates the thing we want to style,
    // so the first attempt is deferred by a task, and then retried for a few
    // frames in case a future version of the extension moves that work again.
    // Bounded, so a quiz that never renders cannot leave a frame loop running.
    const GIVE_UP_AFTER_MS = 5000;
    addEventListener("load", () => {
      const started = performance.now();
      const tick = () => {
        if (paint() > 0 && performance.now() - started < GIVE_UP_AFTER_MS) {
          requestAnimationFrame(tick);
        }
      };
      setTimeout(tick, 0);
    });
  })();
</script>
