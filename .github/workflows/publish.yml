on:
    workflow_dispatch:
    push:
      branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: macos-latest # ubuntu-latest windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up uv
        # setup-uv publishes no floating major tag; pin the SHA
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # installs the Python pinned in .python-version
          enable-cache: true

      - name: Install Python and Dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.2'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Render Quarto
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: book

      # Unlike `quarto publish`, this keeps the PR previews in pr-preview/
      # and does not force-push, as the pr-preview-action README recommends.
      - name: Deploy to GitHub Pages
        # third-party action with write access: pin the SHA
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: book/_book
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
